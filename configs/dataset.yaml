# ---------------------------------------------------------------
# Legacy / single-activity keys (kept for backward compatibility)
# ---------------------------------------------------------------
model:
  weights: "runs/detect/models/pier_monitoring/weights/best.pt"
  save_dir: "models"

dataset:
  root: "datasets/Pier_stem_reinforcement"
  train_path: "datasets/Pier_stem_reinforcement/images/train"
  val_path: "datasets/Pier_stem_reinforcement/images/valid"
  test_path: "datasets/Pier_stem_reinforcement/images/test"

training:
  epochs: 100
  imgsz: 640
  batch: 8
  device: "0"
  optimizer: "AdamW"
  learning_rate: 0.001
  patience: 20

metrics:
  output_file: "outputs/metrics.csv"

rules:
  file: "src/rules/rules.yaml"

# ---------------------------------------------------------------
# Class index  name  (must match the YOLO dataset label indices)
# Activity: Pier Stem Reinforcement
# ---------------------------------------------------------------
classes:
  0: "Crane"
  1: "Pile cap"
  2: "pier rebar"
  3: "vertical rebars"
  4: "worker"

# ---------------------------------------------------------------
# Activity recognition thresholds
# ---------------------------------------------------------------
activity:
  name: "Pier Stem Reinforcement"
  confidence_threshold: 0.5
  temporal_window: 5        # frames to consider for temporal consistency

# ---------------------------------------------------------------
# Multi-activity configuration block
# Each activity defines its own weights, rules, classes, output dir
# ---------------------------------------------------------------
activities:
  reinforcement:
    weights: "runs/detect/models/pier_monitoring/weights/best.pt"
    rules: "src/rules/rules.yaml"
    classes:
      0: "Crane"
      1: "Pile cap"
      2: "pier rebar"
      3: "vertical rebars"
      4: "worker"
    output_dir: "outputs/reinforcement"
    activity_label: "Pier Stem Reinforcement"
    idle_label: "Idle / No Significant Activity"
    confidence_threshold: 0.5
    temporal_window: 5

  casting:
    weights: "runs/detect/models/pier_casting_v2/weights/best.pt"
    rules: "src/rules/rules_stem_casting.yaml"
    classes:
      0: "Casted Pier"
      1: "Concrete Pump"
      2: "Formwork"
      3: "Fresh Concrete"
      4: "Needle Vibrator"
      5: "Transit Mixer"
      6: "Worker"
    output_dir: "outputs/casting"
    activity_label: "Pier Stem Casting"
    idle_label: "Idle / No Casting Activity"
    confidence_threshold: 0.5
    temporal_window: 5

# ---------------------------------------------------------------
# Training config for Pier Stem Casting dataset
# ---------------------------------------------------------------
casting_training:
  data: "configs/casting_dataset.yaml"
  epochs: 100
  imgsz: 640
  batch: 8
  model: "yolov8m.pt"
  name: "pier_casting"
  project: "runs/detect/models"